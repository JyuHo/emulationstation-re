    <feature name="DISABLE VERTEX CACHE" submenu="RENDER" value="rpcs3_vertexcache" description="Disables the vertex cache. May fix flickering geometry at lower performance.">
      <choice name="Off (Default)" value="false" />
      <choice name="On" value="true" />
