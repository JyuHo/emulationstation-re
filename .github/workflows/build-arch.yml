# Builds and checks the Arch Linux x86_64 package. Its badge is in the README. On a v* tag,
# release.yml calls this workflow and publishes the package it builds.
name: Arch Linux x86_64

on:
  push:
    branches: [master]  # keeps the README badge up to date
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  # empty outside a tag: the version then comes from `git describe`
  ES_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  # API keys compiled into the release packages (see "API keys" in the README). They are only
  # given to tag builds: pull request and master builds, whose packages anyone can download as
  # artifacts, are built without them. A secret that is not set is empty, which means no key.
  SCREENSCRAPER_DEV_LOGIN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SCREENSCRAPER_DEV_LOGIN || '' }}
  SCREENSCRAPER_SOFTNAME: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SCREENSCRAPER_SOFTNAME || '' }}
  GAMESDB_APIKEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.GAMESDB_APIKEY || '' }}
  HFS_DEV_LOGIN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.HFS_DEV_LOGIN || '' }}
  CHEEVOS_DEV_LOGIN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CHEEVOS_DEV_LOGIN || '' }}
  # Link-time optimization (Arch's default) more than doubles the link time: only the release
  # packages are built with it, pull request and master builds are not (see the PKGBUILD)
  ES_NO_LTO: ${{ !startsWith(github.ref, 'refs/tags/v') && '1' || '' }}

jobs:
  arch:
    name: Arch Linux x86_64
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo ccache

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ccache's objects of the last build of this branch, else of master (see "Save the compiler cache")
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-arch-${{ github.sha }}
          restore-keys: ccache-arch-

      - name: Build the package
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p "$CCACHE_DIR"
          chown -R builder .
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder --preserve-env=CCACHE_DIR ccache --zero-stats
          cd packaging/arch
          sudo -u builder \
            --preserve-env=SCREENSCRAPER_DEV_LOGIN,SCREENSCRAPER_SOFTNAME,GAMESDB_APIKEY,HFS_DEV_LOGIN,CHEEVOS_DEV_LOGIN,CCACHE_DIR,CCACHE_MAXSIZE,ES_NO_LTO \
            env ES_VERSION="${ES_VERSION#v}" makepkg -sf --noconfirm
          sudo -u builder --preserve-env=CCACHE_DIR ccache --show-stats

      # Not on a tag: those builds compile the API keys in, and they must not end up in a cache
      - name: Save the compiler cache
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-arch-${{ github.sha }}

      - name: Check the package
        run: |
          pacman -Qip packaging/arch/*.pkg.tar.zst
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          emulationstation --help | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
