# On a v* tag, builds the Arch and Debian packages and publishes them as a GitHub release (with
# SHA256SUMS and latest.json), which is where ES finds its updates. Pull requests and pushes to
# master are built by build-arch.yml, build-debian-amd64.yml and build-debian-arm64.yml.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  arch:
    uses: ./.github/workflows/build-arch.yml
    secrets: inherit  # the API keys compiled into the release packages

  debian-amd64:
    uses: ./.github/workflows/build-debian.yml
    secrets: inherit
    with:
      arch: amd64
      runner: ubuntu-24.04
      graphics: -DGL=ON -DES_TESTS=ON

  debian-arm64:
    uses: ./.github/workflows/build-debian.yml
    secrets: inherit
    with:
      arch: arm64             # Raspberry Pi 4 and later
      runner: ubuntu-24.04-arm
      graphics: -DGLES3=ON

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, debian-amd64, debian-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # what ES's update menu reads, from <repo>/releases/latest/download/latest.json
        run: |
          cd packages
          sha256sum -- *.pkg.tar.zst *.deb > SHA256SUMS
          cat SHA256SUMS
          python3 - <<'PY'
          import datetime, json, os, re
          tag = os.environ["TAG"]
          packages = {}
          for line in open("SHA256SUMS"):
              sha, name = line.split()
              m = re.fullmatch(r"emulationstation-re-.+-(x86_64|aarch64)\.pkg\.tar\.zst", name)
              key = f"arch-{m.group(1)}" if m else None
              m = re.fullmatch(r"emulationstation-re_.+_(amd64|arm64)\.deb", name)
              key = f"debian-{m.group(1)}" if m else key
              if key:
                  packages[key] = {"file": name, "sha256": sha, "size": os.path.getsize(name)}
          latest = {
              "format": 1,
              "version": tag.removeprefix("v"),
              "tag": tag,
              "date": datetime.date.today().isoformat(),
              "url": f"{os.environ['REPO_URL']}/releases/tag/{tag}",
              "packages": packages,
          }
          json.dump(latest, open("latest.json", "w"), indent=2)
          print(json.dumps(latest, indent=2))
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # a release made by hand for the tag gets the files; otherwise it is created here
        run: |
          cd packages
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber -- *
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --generate-notes --verify-tag $prerelease -- *
          fi
