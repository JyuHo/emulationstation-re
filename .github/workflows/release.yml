# Builds the Arch and Debian packages. On a v* tag, publishes them as a GitHub release
# (with SHA256SUMS), which is where ES finds its updates.
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '*/CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  # empty outside a tag: the version then comes from `git describe`
  ES_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  arch:
    name: Arch Linux x86_64
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build the package
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder .
          sudo -u builder git config --global --add safe.directory '*'
          cd packaging/arch
          sudo -u builder env ES_VERSION="${ES_VERSION#v}" makepkg -sf --noconfirm

      - name: Check the package
        run: |
          pacman -Qip packaging/arch/*.pkg.tar.zst
          pacman -U --noconfirm packaging/arch/*.pkg.tar.zst
          emulationstation --help | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian trixie ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            graphics: -DGL=ON -DES_TESTS=ON
          - arch: arm64             # Raspberry Pi 4 and later
            runner: ubuntu-24.04-arm
            graphics: -DGLES3=ON
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential cmake \
            ninja-build dpkg-dev file libsdl3-dev libfreeimage-dev libfreetype-dev \
            libcurl4-openssl-dev rapidjson-dev libvlc-dev libasound2-dev libgles-dev libgl-dev \
            libudev-dev libfribidi-dev libcec-dev gettext

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build the package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            ${{ matrix.graphics }} ${ES_VERSION:+-DES_VERSION="$ES_VERSION"}
          cmake --build build
          if [ -f build/CTestTestfile.cmake ]; then ctest --test-dir build --output-on-failure; fi
          cd build && cpack -G DEB

      - name: Check the package
        run: |
          dpkg-deb --info build/*.deb
          apt-get install -y ./build/*.deb
          emulationstation --help | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, debian]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # what ES's update menu reads, from <repo>/releases/latest/download/latest.json
        run: |
          cd packages
          sha256sum -- *.pkg.tar.zst *.deb > SHA256SUMS
          cat SHA256SUMS
          python3 - <<'PY'
          import datetime, json, os, re
          tag = os.environ["TAG"]
          packages = {}
          for line in open("SHA256SUMS"):
              sha, name = line.split()
              m = re.fullmatch(r"emulationstation-re-.+-(x86_64|aarch64)\.pkg\.tar\.zst", name)
              key = f"arch-{m.group(1)}" if m else None
              m = re.fullmatch(r"emulationstation-re_.+_(amd64|arm64)\.deb", name)
              key = f"debian-{m.group(1)}" if m else key
              if key:
                  packages[key] = {"file": name, "sha256": sha, "size": os.path.getsize(name)}
          latest = {
              "format": 1,
              "version": tag.removeprefix("v"),
              "tag": tag,
              "date": datetime.date.today().isoformat(),
              "url": f"{os.environ['REPO_URL']}/releases/tag/{tag}",
              "packages": packages,
          }
          json.dump(latest, open("latest.json", "w"), indent=2)
          print(json.dumps(latest, indent=2))
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd packages
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes --verify-tag $prerelease -- *
