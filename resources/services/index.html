<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Dashboard - EmulationStation-RE</title>
	<link rel="icon" href="/resources/splash.svg" type="image/svg+xml">
	<link href="app.css" rel="stylesheet">
	<script src="app.js"></script>
</head>

<body>

<main id="content">
	<div class="grid stats" id="stats"></div>

	<div class="grid cols">
		<section class="card">
			<div class="card-head" id="systemsHead"></div>
			<div id="systems"><div class="empty">Loading...</div></div>
		</section>

		<div class="stack">
			<section class="card">
				<div class="card-head" id="playingHead"></div>
				<div class="card-body" id="playing"></div>
			</section>

			<section class="card">
				<div class="card-head" id="actionsHead"></div>
				<div class="card-body actions" id="actions"></div>
			</section>

			<section class="card">
				<div class="card-head" id="topHead"></div>
				<div id="top"></div>
			</section>
		</div>
	</div>
</main>

<script>
ES.shell("dashboard", "Dashboard");

function head(id, iconName, title, extra) {
	document.getElementById(id).innerHTML = ES.icon(iconName) + "<span>" + ES.escapeHtml(title) + "</span>" + (extra || "");
}

head("systemsHead", "systems", "Systems", '<div class="spacer"></div><a class="btn btn-sm" href="games.html">Browse games</a>');
head("playingHead", "activity", "Now playing");
head("actionsHead", "dashboard", "Quick actions");
head("topHead", "trophy", "Most played per system");

document.getElementById("actions").innerHTML =
	'<button class="btn" data-run="reload">' + ES.icon("reload") + 'Reload games</button>' +
	'<a class="btn" href="files.html">' + ES.icon("upload") + 'Add ROMs</a>' +
	'<button class="btn btn-danger" data-run="emukill">' + ES.icon("stop") + 'Stop emulator</button>' +
	'<button class="btn btn-danger" data-run="quit">' + ES.icon("power") + 'Quit ES</button>';

document.querySelectorAll("[data-run]").forEach(function(el) {
	el.onclick = function() { ES.run(el.dataset.run); };
});

function stat(iconName, value, label) {
	return '<div class="card stat"><div class="stat-icon">' + ES.icon(iconName) + '</div>' +
		'<div><div class="stat-value">' + ES.escapeHtml(value) + '</div><div class="stat-label">' + ES.escapeHtml(label) + '</div></div></div>';
}

function showSystems(list) {
	// Real game systems only: collections and groups count the same games again
	var systems = list.filter(function(s) {
		return s.visible == "true" && s.gamesystem == "true" && s.collection != "true" && s.groupsystem != "true";
	});

	var total = 0, favorites = 0, played = 0, max = 1;
	systems.forEach(function(s) {
		total += s.totalGames || 0;
		favorites += s.favoriteGames || 0;
		played += s.playedGames || 0;
		max = Math.max(max, s.totalGames || 0);
	});

	document.getElementById("stats").innerHTML =
		stat("systems", systems.length, "Systems") +
		stat("games", total, "Games") +
		stat("star", favorites, "Favorites") +
		stat("play", played, "Games played");

	systems.sort(function(a, b) { return (b.totalGames || 0) - (a.totalGames || 0) || ES.byName(a, b); });

	if (!systems.length) {
		document.getElementById("systems").innerHTML = '<div class="empty">No system with games yet. <a href="files.html">Add ROMs</a></div>';
		document.getElementById("top").innerHTML = '<div class="empty">Nothing played yet</div>';
		return;
	}

	var rows = systems.map(function(s) {
		var name = ES.escapeHtml(s.fullname || s.name);
		var logo = s.logo ? '<img class="syslogo" loading="lazy" src="' + ES.escapeHtml(s.logo) + '" alt="' + name + '" title="' + name + '">' : name;
		var maker = [s.manufacturer, s.releaseYear].filter(Boolean).join(", ");
		return '<tr>' +
			'<td><a href="games.html#' + encodeURIComponent(s.name) + '">' + logo + '</a></td>' +
			'<td><div>' + name + '</div><div class="muted">' + ES.escapeHtml(maker) + '</div></td>' +
			'<td class="hide-sm" style="width:28%"><div class="bar"><span style="width:' + Math.round((s.totalGames || 0) * 100 / max) + '%"></span></div></td>' +
			'<td class="num">' + (s.totalGames || 0) + '</td>' +
			'<td class="num muted hide-sm">' + (s.favoriteGames || 0) + ' &#9733;</td>' +
			'</tr>';
	}).join("");

	document.getElementById("systems").innerHTML =
		'<table class="list"><thead><tr><th></th><th>System</th><th class="hide-sm"></th><th class="num">Games</th><th class="num hide-sm">Fav.</th></tr></thead><tbody>' + rows + '</tbody></table>';

	var top = systems.filter(function(s) { return s.mostPlayedGame; }).slice(0, 8).map(function(s) {
		return '<tr><td><div>' + ES.escapeHtml(s.mostPlayedGame) + '</div><div class="muted">' + ES.escapeHtml(s.fullname || s.name) + '</div></td></tr>';
	}).join("");

	document.getElementById("top").innerHTML = top ? '<table class="list"><tbody>' + top + '</tbody></table>' : '<div class="empty">Nothing played yet</div>';
}

ES.onStatus(function(game) {
	var el = document.getElementById("playing");
	if (game === undefined) {
		el.innerHTML = '<div class="empty">EmulationStation does not answer</div>';
		return;
	}
	if (!game) {
		el.innerHTML = '<div class="empty">No game running</div>';
		return;
	}

	var art = game.thumbnail || game.image;
	el.innerHTML =
		'<div class="playing">' + (art ? '<img src="' + ES.escapeHtml(art) + '" alt="">' : '') +
		'<div><div class="playing-name">' + ES.escapeHtml(game.name) + '</div>' +
		'<div class="muted">' + ES.escapeHtml(game.systemName) + '</div>' +
		'<button class="btn btn-danger btn-sm" style="margin-top:8px" id="stopGame">' + ES.icon("stop") + 'Stop</button></div></div>';
	document.getElementById("stopGame").onclick = function() { ES.run("emukill"); };
});

ES.getJson("/systems").then(showSystems).catch(function(e) {
	document.getElementById("systems").innerHTML = '<div class="empty error">' + ES.escapeHtml(e.message) + '</div>';
});
</script>
</body>
</html>
